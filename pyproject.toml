[project]
name = "duke"
version = "0.1.0"
description = "Agricultural assistant chatbot for Ekylibre"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "starlette>=0.41",
    "spacy>=3.8",
    "rapidfuzz>=3.10",
    "anthropic>=0.40",
    "mistralai>=1.2,<2",
    # Required by FastAPI at import time for the STT multipart route — even
    # when ENABLE_SERVER_STT is false, FastAPI introspects the `UploadFile`
    # parameter at decoration and raises if python-multipart is missing.
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
    "respx>=0.21",
    "ruff>=0.7",
]
stt = [
    "faster-whisper>=1.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duke"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests requiring docker (testcontainers)",
    "ekylibre_real: opt-in e2e against a running Ekylibre dev container (set RUN_EKYLIBRE_E2E=1)",
    "ner_training: opt-in NER training smoke test (set RUN_NER_TRAINING=1)",
    "stt_smoke: opt-in real Whisper transcription smoke (set RUN_STT_SMOKE=1)",
]
