# Duke NLU golden corpus.
#
# Each entry has:
#   text     — the French sentence
#   intent   — record_intervention | qa_stock | qa_history | out_of_scope | unknown
#   entities — optional list of {label, span, nth?} where `span` is the literal
#              substring of `text` and `nth` (default 0) selects which occurrence
#              when the substring repeats. The converter resolves spans to
#              character offsets at training time and validates token alignment.
#
# Labels: DUKE_PRODUCT | DUKE_PROCEDURE | DUKE_PARCEL | DUKE_QUANTITY |
#         DUKE_WORKER | DUKE_TOOL
#
# Dates and durations are NOT NER labels — `nlu/temporal.py` extracts them
# deterministically (regex over French phrasing: "ce matin", "pendant 2h",
# "à 14h30", "15/03/2024") into a structured `TemporalExtraction` that
# feeds the LLM via NLU hints. Annotating dates/durations as entities would
# duplicate signal without helping the resolution path.
#
# Used by:
#   - tests/integration/test_golden_intents.py (intent accuracy gate)
#   - duke.cli.train_ner / duke.nlu.training.* (NER training + eval)
#
# Extend through user feedback (see ARCHITECTURE.md §9.2).

