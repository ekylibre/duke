services:
  duke-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: duke-api
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    depends_on:
      postgres-duke:
        condition: service_healthy
    networks:
      - duke
      - ekylibre
    restart: unless-stopped

  postgres-duke:
    image: postgres:16-alpine
    container_name: postgres-duke
    environment:
      POSTGRES_USER: duke
      POSTGRES_PASSWORD: duke
      POSTGRES_DB: duke
    volumes:
      - postgres-duke-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duke -d duke"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - duke
    restart: unless-stopped

volumes:
  postgres-duke-data:

networks:
  duke:
    driver: bridge
  ekylibre:
    external: true
