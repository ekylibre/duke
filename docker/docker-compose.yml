services:
  duke-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Build-time switch. Set `INSTALL_STT=true` in the shell running
        # `docker compose build` to bake faster-whisper into the image
        # (~250 MB extra). Runtime activation is a separate concern —
        # set `ENABLE_SERVER_STT=true` in the container env (`.env`).
        INSTALL_STT: "${INSTALL_STT:-false}"
    container_name: duke-api
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    depends_on:
      postgres-duke:
        condition: service_healthy
    volumes:
      # Persist the faster-whisper model weights (HuggingFace Hub cache)
      # across container rebuilds — without this the ~150 MB download fires
      # on every `docker compose up` after a build that invalidates the
      # venv layer.
      - whisper-cache:/home/duke/.cache/huggingface
    networks:
      - duke
      - ekylibre
    restart: unless-stopped

  postgres-duke:
    image: postgres:16-alpine
    container_name: postgres-duke
    environment:
      POSTGRES_USER: duke
      POSTGRES_PASSWORD: duke
      POSTGRES_DB: duke
    volumes:
      - postgres-duke-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duke -d duke"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - duke
    restart: unless-stopped

  # Local LLM (opt-in). Enable with: `docker compose --profile local-llm up`.
  # duke-api reaches it at http://ollama:11434 when OLLAMA_BASE_URL is set in
  # `.env`. No `depends_on` on duke-api: the provider connects lazily and the
  # router falls back to the default chain if Ollama is down.
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles: ["local-llm"]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - duke
    restart: unless-stopped
    # GPU (NVIDIA) — mistral-nemo (~12B) is slow on CPU. Uncomment to use the
    # host GPU (requires the NVIDIA Container Toolkit).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot: pulls the default model into the ollama volume, then exits.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull
    profiles: ["local-llm"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["ollama", "pull", "mistral-nemo"]
    networks:
      - duke
    restart: "no"

volumes:
  postgres-duke-data:
  whisper-cache:
  ollama-models:

networks:
  duke:
    driver: bridge
  ekylibre:
    external: true
